<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1f2d3d;font-size:20px}
  .top{background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;padding:28px 18px;text-align:center}

  .card .go{flex:none;font-size:16px;font-weight:800;color:#1565c0;background:#e3f0ff;padding:10px 16px;border-radius:22px}
  .card.hot .ic{background:#fff3e0}
  .card.hot .go{color:#e65100;background:#fff3e0}
  .card.soon{opacity:.62}
  .card.soon .go{color:#889;background:#eef1f5}
  .back{display:block;text-align:center;margin:22px auto 8px;color:#1565c0;text-decoration:none;font-size:20px}
  .foot{max-width:640px;margin:4px auto 30px;padding:0 18px;font-size:15px;color:#889;line-height:1.8;text-align:center}
</style>
</head>
