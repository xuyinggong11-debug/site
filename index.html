<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乳腺外科 · 科室服务</title>
<style>
  :root{ --blue:#1565c0; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1f2d3d;}
  .hero{background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;padding:30px 20px;text-align:center;}
  .hero h1{margin:0;font-size:22px;letter-spacing:1px;}
  .hero p{margin:8px 0 0;opacity:.92;font-size:13px;}
  .grid{max-width:640px;margin:18px auto;padding:0 14px;display:grid;gap:14px;}
  .tile{background:#fff;border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.15s;}
  .tile:active{transform:scale(.98);}
  .tile .ic{width:48px;height:48px;border-radius:12px;background:#e3f0ff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;}
  .tile .t{font-size:17px;font-weight:700;}
  .tile .d{font-size:12px;color:#667;margin-top:3px;line-height:1.5;}
  .badge{margin-left:auto;font-size:11px;color:#1565c0;background:#e3f0ff;padding:3px 8px;border-radius:20px;}
  .foot{max-width:640px;margin:6px auto 30px;padding:0 16px;font-size:12px;color:#889;line-height:1.7;text-align:center;}
</style>
</head>
<body>
<div class="hero">
  <h1>乳腺外科 · 科室服务</h1>
  <p>医生电话 · 健康宣教 · 一站式患者服务</p>
</div>

<div class="grid">
  <a class="tile" href="contact.html">
    <div class="ic">📞</div>
    <div>
      <div class="t">联系主管医生</div>
      <div class="d">患者请扫所在治疗组的专属二维码</div>
    </div>
    <div class="badge">按组</div>
  </a>

  <a class="tile" href="jiaoyu.html">
    <div class="ic">📚</div>
    <div>
      <div class="t">健康宣教</div>
      <div class="d">术前准备 / 术后护理 / 复查须知等科普</div>
    </div>
    <div class="badge">已上线</div>
  </a>

  <a class="tile" href="#">
    <div class="ic">🗓️</div>
    <div>
      <div class="t">出诊安排</div>
      <div class="d">后续可加门诊时间表（待开通）</div>
    </div>
    <div class="badge">规划中</div>
  </a>

  <a class="tile" href="#">
    <div class="ic">💬</div>
    <div>
      <div class="t">常见问题</div>
      <div class="d">后续可加就诊流程答疑（待开通）</div>
    </div>
    <div class="badge">规划中</div>
  </a>
</div>

<div class="foot">本网站所有内容由科室维护更新，模块可随需扩展。<br>如有疑问请联系护士站。</div>
</body>
</html>
