<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系主管医生 · 乳腺外科</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1f2d3d}
  .top{background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;padding:22px 18px;text-align:center}
  .top h1{margin:0;font-size:20px}
  .top p{margin:6px 0 0;opacity:.9;font-size:13px}
  .wrap{max-width:640px;margin:18px auto;padding:0 16px;line-height:1.8}
  .box{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .box h2{font-size:16px;margin:0 0 10px;color:#1565c0}
  .box p{margin:8px 0;font-size:14px;color:#333}
  .back{display:block;text-align:center;margin:18px auto;color:#1565c0;text-decoration:none;font-size:14px}
  .groups{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .groups span{background:#e3f0ff;color:#1565c0;font-size:13px;padding:5px 10px;border-radius:20px}
</style>
</head>
<body>
<div class="top"><h1>联系您的主管医生</h1><p>乳腺外科 · 患者专属联系</p></div>
<div class="wrap">
  <div class="box">
    <h2>为什么看不到全部医生？</h2>
    <p>为保护每位患者的隐私，我们按治疗组分开：<b>您只能看到自己所在治疗组的医生</b>，看不到、也拨不了其他组的电话。</p>
    <p><b>怎么联系您的医生：</b>请向护士站或您的主管医生索取您所在治疗组的<b>专属二维码</b>（如下方某一组），用微信扫一扫即可看到本组医生并一键拨打。</p>
    <p style="color:#889;font-size:13px">治疗组包括：</p>
    <div class="groups">
      <span>徐景伟组</span><span>姜义组</span><span>刘斌组</span><span>金镝组</span>
      <span>陈云波·张研组</span><span>张颖超组</span><span>王丹组</span><span>尹光浩组</span><span>王振宇组</span>
    </div>
  </div>
  <a class="back" href="index.html">← 返回科室首页</a>
</div>

</html>
